<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bionic Passport</title>
  <meta name="description" content="Check whether a medical implant or prosthesis will work in an orbital habitat, on the Moon or on Mars, and what must change.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="engine.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14"/><circle cx="32" cy="32" r="15"/><path d="M17 32h30M32 17c-6 8-6 22 0 30M32 17c6 8 6 22 0 30"/></svg>
        <span>Bionic Passport</span>
        <span class="brand-badge">Traveler Companion</span>
      </div>
      <div class="nav-right">
        <div class="tabs" role="tablist" aria-label="Sections">
          <button type="button" class="tab" role="tab" aria-selected="true" id="tab-config" aria-controls="view">Medical Device Configuration</button>
        </div>
        <button type="button" class="account-btn" id="account-btn" aria-haspopup="dialog" aria-expanded="false" title="Open My Traveler Passport and Saved Trips">
          <span class="account-avatar" id="nav-avatar">AM</span>
          <span class="account-text">
            <span class="account-name" id="nav-name">Alex Mercer</span>
            <span class="account-role" id="nav-role">Space Traveler</span>
          </span>
          <svg class="account-chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8l4 4 4-4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="view" class="view" role="tabpanel" aria-labelledby="tab-config" tabindex="-1">
    <p class="boot">Loading destinations and devices...</p>
  </main>

  <!-- Account Space Dialog -->
  <dialog id="account-dialog" class="account-dialog" aria-labelledby="account-modal-title">
    <div class="account-dialog-card" id="account-dialog-content">
      <!-- Dynamically populated by app.js -->
    </div>
  </dialog>

  <!-- Passport Assistant (Gemini chat, grounded in the rules engine) -->
  <button type="button" class="chat-fab" id="chat-fab" aria-controls="chat-panel" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span class="chat-fab-label">Ask the assistant</span>
  </button>
  <section class="chat-panel" id="chat-panel" aria-labelledby="chat-title" hidden>
    <header class="chat-head">
      <div>
        <h2 id="chat-title" class="chat-title">Passport Assistant</h2>
        <p class="chat-sub" id="chat-sub">Answers for your account</p>
      </div>
      <button type="button" class="chat-close" id="chat-close" aria-label="Close the assistant">&times;</button>
    </header>
    <div class="chat-log" id="chat-log" role="log" aria-live="polite"></div>
    <form class="chat-form" id="chat-form">
      <label class="sr-only" for="chat-input">Message to the assistant</label>
      <textarea id="chat-input" rows="2" maxlength="2000" placeholder="Ask about your trip or your device"></textarea>
      <button type="submit" class="btn btn-primary chat-send" id="chat-send">Send</button>
    </form>
    <p class="chat-note">AI answers can be wrong. Verdicts come from the rules engine. Not medical advice. Messages are sent to Google Gemini.</p>
  </section>

  <nav class="progress" aria-label="Progress">
    <div class="progress-inner">
      <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
      <ol class="progress-steps">
        <li><button type="button" class="pstep" data-step="1"><span class="pdot">1</span><span class="plabel">Destination</span></button></li>
        <li><button type="button" class="pstep" data-step="2"><span class="pdot">2</span><span class="plabel">Device</span></button></li>
        <li><button type="button" class="pstep" data-step="3"><span class="pdot">3</span><span class="plabel">Result</span></button></li>
      </ol>
    </div>
  </nav>
  <div id="tooltip" class="tooltip" role="status" hidden></div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bionic Passport</title>
  <meta name="description" content="Check whether a medical implant or prosthesis will work in an orbital habitat, on the Moon or on Mars, and what must change.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="engine.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14"/><circle cx="32" cy="32" r="15"/><path d="M17 32h30M32 17c-6 8-6 22 0 30M32 17c6 8 6 22 0 30"/></svg>
        Bionic Passport
      </span>
      <div class="tabs" role="tablist" aria-label="Sections">
        <button type="button" class="tab" role="tab" aria-selected="true" id="tab-config" aria-controls="view">Medical Device Configuration</button>
      </div>
    </div>
  </header>

  <main id="view" class="view" role="tabpanel" aria-labelledby="tab-config" tabindex="-1">
    <p class="boot">Loading destinations and devices…</p>
  </main>

  <nav class="progress" aria-label="Progress">
    <div class="progress-inner">
      <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
      <ol class="progress-steps">
        <li><button type="button" class="pstep" data-step="1"><span class="pdot">1</span><span class="plabel">Destination</span></button></li>
        <li><button type="button" class="pstep" data-step="2"><span class="pdot">2</span><span class="plabel">Device</span></button></li>
        <li><button type="button" class="pstep" data-step="3"><span class="pdot">3</span><span class="plabel">Result</span></button></li>
      </ol>
    </div>
  </nav>
  <div id="tooltip" class="tooltip" role="status" hidden></div>
</body>
</html>
